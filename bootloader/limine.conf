# ╔══════════════════════════════════════════════════════════════╗
# ║  Zircon OS Boot Menu — Limine Configuration                       ║
# ║  Google-free mobile/desktop OS built on CodeOS kernel          ║
# ╚══════════════════════════════════════════════════════════════╝

# ── Global Settings ──────────────────────────────────────────
timeout: 5
default_entry: 0
serial: yes
verbose: yes
remember_last_entry: yes
editor_enabled: yes
editor_highlighting: yes

# ── Interface ────────────────────────────────────────────────
interface_branding: Zircon v1.0.0
interface_branding_colour: 40D9F0
interface_help_colour: 8a8a9e
interface_help_colour_bright: b0acc8
interface_help_hidden: no

# ── Wallpaper ────────────────────────────────────────────────
wallpaper: boot():/boot/splash.png
wallpaper_style: stretched

# ── Terminal Colors ──────────────────────────────────────────
term_background: 000a0a1e
term_foreground: b0b8c8
term_background_bright: 000a0a1e
term_foreground_bright: e8ecf4
term_margin: 4
term_margin_gradient: 8
term_font_scale: 1x1
term_font_spacing: 1

# ═══════════════════════════════════════════════════════════════
# Boot Entries
# ═══════════════════════════════════════════════════════════════

# ── Zircon OS ──
/Zircon
    comment: Zircon OS — Google-free mobile/desktop OS
    protocol: limine
    kernel_path: boot():/boot/zircon-kernel.bin
    cmdline: loglevel=4 zircon.init=/sbin/zircon_init

# ── Zircon (Debug) ──
/Zircon (Debug)
    comment: Boot Zircon with debug output
    protocol: limine
    kernel_path: boot():/boot/zircon-kernel.bin
    cmdline: loglevel=8 zircon.init=/sbin/zircon_init debug

# ── Zircon (Recovery) ──
/Zircon (Recovery)
    comment: Boot into single-user recovery mode
    protocol: limine
    kernel_path: boot():/boot/zircon-kernel.bin
    cmdline: loglevel=4 recovery single

# ── CodeOS ──
/CodeOS
    comment: CodeOS desktop environment (HyperDE)
    protocol: limine
    kernel_path: boot():/boot/codeos-1-kernel.bin
    cmdline: loglevel=4 httpsboot
